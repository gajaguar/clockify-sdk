[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clockify-unofficial-sdk"
version = "1.0.1"
description = "Unofficial, typed Python SDK for the Clockify API."
readme = "README.md"
license = "MIT"
authors = [
  { name = "G.A.JAGUAR", email = "dev@gajaguar.com" },
]
requires-python = ">=3.14"
keywords = ["clockify", "time-tracking", "sdk", "api-client"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/gajaguar/clockify-sdk"
Repository = "https://github.com/gajaguar/clockify-sdk"
Issues = "https://github.com/gajaguar/clockify-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clockify"]

[dependency-groups]
dev = [
  "conventional-git>=1.1",
  "mypy>=2.3.1",
  "pylint-gajaguar>=2.0",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "respx>=0.22",
  "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=clockify --cov-report=term-missing --cov-fail-under=90"
markers = [
  "live: hits the real Clockify API (requires CLOCKIFY_TEST_API_KEY)",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["missing-trailing-comma", "CPY", "D"]
lint.isort.force-single-line = true
lint.isort.case-sensitive = true
lint.flake8-type-checking.runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "clockify.models.base.ClockifyModel",
]
lint.flake8-bugbear.extend-immutable-calls = ["pydantic.Field"]
lint.per-file-ignores."tests/**/*.py" = ["ANN", "magic-value-comparison", "assert", "hardcoded-password-func-arg"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]
